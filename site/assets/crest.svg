<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- The favicon: the crest on the football, the scope locked on the root of the tail -->
  <rect width="240" height="240" rx="28" fill="#0A1F2E"/>
  <defs>
    <path id="f78" d="M0 0C5.2-23.4 13-46.8 10.4-66.3Q0-81.9-10.4-66.3C-13-46.8-5.2-23.4 0 0Z"/>
    <path id="f96" d="M0 0C5.2-28.8 13-57.6 10.4-81.6Q0-100.8-10.4-81.6C-13-57.6-5.2-28.8 0 0Z"/>
    <path id="f112" d="M0 0C5.6-33.6 14-67.2 11.2-95.2Q0-117.6-11.2-95.2C-14-67.2-5.6-33.6 0 0Z"/>
    <clipPath id="ballClip"><circle cx="120" cy="134" r="60"/></clipPath>
  </defs>

  <!-- the analysis scope: lock ring and east-west ticks, centred on the root of the tail -->
  <g stroke="#F4F1E8" stroke-width="2.4" fill="none" opacity="0.85">
    <circle cx="120" cy="134" r="78" stroke-dasharray="9 8"/>
    <line x1="32" y1="134" x2="40" y2="134"/>
    <line x1="200" y1="134" x2="208" y2="134"/>
  </g>

  <!-- the football, seams clipped to the ball -->
  <g clip-path="url(#ballClip)">
    <circle cx="120" cy="134" r="60" fill="#0E2940" stroke="#F4F1E8" stroke-width="1.8"/>
    <g fill="none" stroke="#F4F1E8" stroke-width="2.2" stroke-linejoin="round">
      <path d="M120 178 L106.7 187.7 L111.8 203.3 L128.2 203.3 L133.3 187.7 Z"/>
      <path d="M85 142 L73.6 150.3 L77.9 163.7 L92.1 163.7 L96.4 150.3 Z"/>
      <path d="M155 142 L143.6 150.3 L147.9 163.7 L162.1 163.7 L166.4 150.3 Z"/>
      <path d="M68 114 L56.6 122.3 L60.9 135.7 L75.1 135.7 L79.4 122.3 Z"/>
      <path d="M152 114 L140.6 122.3 L144.9 135.7 L159.1 135.7 L163.4 122.3 Z"/>
      <path d="M107 186 Q98 168 96.5 152"/>
      <path d="M133 186 Q142 168 143.5 152"/>
      <path d="M74 150 Q74 142 75 136"/>
      <path d="M166 150 Q166 142 165 136"/>
      <path d="M112 203 Q116 208 120 208"/>
      <path d="M128 203 Q124 208 120 208"/>
      <path d="M57 124 Q52 128 49 133"/>
      <path d="M183 124 Q188 128 191 133"/>
    </g>
  </g>

  <!-- the crest, unchanged: five feathers, the Critic's in gold, printed on the ball -->
  <g transform="translate(120 134)" fill="#B8F53D">
    <use href="#f78" transform="rotate(-52)"/>
    <use href="#f96" transform="rotate(-26)"/>
    <use href="#f112" fill="#C9A227"/>
    <use href="#f96" transform="rotate(26)"/>
    <use href="#f78" transform="rotate(52)"/>
  </g>

  <!-- the lens at the root: where every claim is checked -->
  <circle cx="120" cy="134" r="11" fill="#0A1F2E" stroke="#C9A227" stroke-width="2.5"/>
  <circle cx="120" cy="134" r="2.6" fill="#C9A227"/>
</svg>
