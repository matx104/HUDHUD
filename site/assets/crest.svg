<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- The favicon: the crest printed on the classic ball, the scope's lens locked on the root of the tail -->
  <rect width="240" height="240" rx="28" fill="#0A1F2E"/>
  <defs>
    <path id="p78" d="M0 0C4.2-19.5 11-42 7.6-56Q0-74-7.6-56C-11-42-4.2-19.5 0 0Z"/>
    <path id="p96" d="M0 0C4.8-22.5 13-49 9-67.5Q0-89-9-67.5C-13-49-4.8-22.5 0 0Z"/>
    <path id="p112" d="M0 0C5-24 13.5-51.5 9.6-74.5Q0-95-9.6-74.5C-13.5-51.5-5-24 0 0Z"/>
    <path id="t-root" d="M107.9 167.5 L132.1 167.5 L139.6 149.2 L120 137.9 L100.4 149.2 Z"/>
    <path id="t-top" d="M100.4 101 L120 113.8 L139.6 101 L132.1 80.3 L107.9 80.3 Z"/>
    <path id="t-left" d="M68.7 141.9 L80.8 136.4 L80.8 112.3 L68.7 102.9 L61.2 121.2 Z"/>
    <path id="t-right" d="M159.2 136.4 L171.3 141.9 L178.8 121.2 L171.3 102.9 L159.2 112.3 Z"/>
  </defs>

  <!-- the classic ball, small detail: white hexagons, pitch-green pentagons -->
  <circle cx="120" cy="120" r="60" fill="#F4F1E8"/>
  <g fill="#1E7B45" stroke="#1E7B45" stroke-width="2" stroke-linejoin="round">
    <use href="#t-root"/><use href="#t-top"/><use href="#t-left"/><use href="#t-right"/>
  </g>

  <!-- the crest: five feathers rooted in the bottom pentagon, tips at the rim, the Critic's gold on top -->
  <g transform="translate(120 156)" fill="#B8F53D" stroke="#0A1F2E" stroke-width="2" stroke-linejoin="round">
    <use href="#p78" transform="rotate(-52)"/>
    <use href="#p96" transform="rotate(-26)"/>
    <use href="#p96" transform="rotate(26)"/>
    <use href="#p78" transform="rotate(52)"/>
    <use href="#p112" fill="#C9A227"/>
  </g>

  <!-- the lens at the root: where every claim is checked -->
  <circle cx="120" cy="154" r="9" fill="#0A1F2E" stroke="#C9A227" stroke-width="2.8"/>
  <circle cx="120" cy="154" r="2.6" fill="#C9A227"/>
</svg>
