name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            packages/event-schema/pyproject.toml
            apps/api/pyproject.toml
      - name: Install workspace (editable, local paths)
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest
      - name: JSON Schema is current
        run: python -m match_events schema && git diff --exit-code packages/event-schema/schema
      - name: The output stream's JSON Schema is current
        run: python -m court schema && git diff --exit-code apps/api/schema
      - name: Smoke-run one match through all five agents
        run: python -m court run --seed 7 --overreach 0.25
      - name: Showcase data matches the pipeline
        run: python scripts/site_sample.py && git diff --exit-code site/data
      - name: Showcase site tests (routes, crawler tags, assets)
        run: node --test tests/site/*.test.cjs
