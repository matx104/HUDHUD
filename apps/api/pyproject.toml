[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "match-court"
version = "0.1.0"
description = "Multi-agent match intelligence: Orchestrator, Scout, Narrator, Critic, Localizer"
requires-python = ">=3.12"
dependencies = [
    # Workspace sibling: install both via requirements-dev.txt (editable, local paths).
    "match-events",
    "agent-framework-core>=1.22,<2",
    "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
court = "court.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/court"]
