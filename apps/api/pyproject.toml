[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "match-court"
version = "0.1.0"
description = "Multi-agent match intelligence: Orchestrator, Scout, Narrator, Critic, Localizer"
requires-python = ">=3.12"
dependencies = [
    # Workspace sibling: install both via requirements-dev.txt (editable, local paths).
    "match-events",
    "agent-framework-core>=1.22,<2",
    "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "fastapi>=0.115,<1", "httpx>=0.27"]
server = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30"]
# Live narration on models deployed in the Foundry project. Not needed for tests or CI,
# which run the offline template narrator.
foundry = ["agent-framework-foundry>=1.15,<2", "azure-identity>=1.19"]
audit = ["azure-cosmos>=4.9,<5", "azure-identity>=1.19", "aiohttp>=3.10"]
telemetry = ["azure-monitor-opentelemetry>=1.8,<2", "azure-identity>=1.19"]

[project.scripts]
court = "court.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/court"]
