<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{name}}: video thumbnail</title>
  <!-- The demo video's thumbnail: 1280 by 720, legible at a phone's thumbnail size (scripts/drive_kit.py) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Hanken+Grotesk:wght@400&family=JetBrains+Mono:wght@400&display=swap">
  <style>
    html, body { margin: 0; }
    .card {
      position: relative;
      width: 1280px;
      height: 720px;
      overflow: hidden;
      color: #F4F1E8;
      background:
        radial-gradient(420px 300px at 100% 100%, rgba(201, 162, 39, 0.16), transparent 70%),
        #0A1F2E;
    }
    /* The pitch, faintly: touchlines, the halfway line, the centre circle */
    .pitch { position: absolute; inset: 28px; border: 1px solid rgba(244, 241, 232, 0.09); border-radius: 6px; }
    .pitch::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 1px solid rgba(244, 241, 232, 0.07); }
    .pitch::after { content: ""; position: absolute; left: calc(50% - 86px); top: calc(50% - 86px); width: 170px; height: 170px; border: 1px solid rgba(244, 241, 232, 0.07); border-radius: 50%; }
    .glow { position: absolute; left: 10px; top: 120px; width: 520px; height: 520px; background: radial-gradient(closest-side, rgba(184, 245, 61, 0.24), rgba(184, 245, 61, 0.07) 45%, transparent); }
    .crest { position: absolute; left: 50px; top: 140px; width: 440px; height: 440px; }
    .word { position: absolute; left: 500px; top: 96px; font: 900 236px/1 "Big Shoulders Display", sans-serif; }
    .promise { position: absolute; left: 504px; top: 352px; width: 700px; font: 800 84px/0.92 "Big Shoulders Display", sans-serif; color: #C9A227; }
    .what { display: none; }
    .host { position: absolute; left: 508px; top: 560px; font: 500 34px/1 "JetBrains Mono", monospace; color: #B8F53D; }
    .chain { position: absolute; left: 1040px; top: 600px; width: 180px; height: 80px; }
  </style>
</head>
<body>

    <div class="pitch"></div>
    <div class="glow"></div>

        <g stroke-width="2.2" stroke-opacity=".85" stroke-linecap="round">

    <div class="word">{{name}}</div>
    <div class="promise">Every call comes with its evidence.</div>
    <p class="what">Five AI agents commentate a live football match. A Critic checks every claim against the match events before it airs.</p>
    <div class="host">The 110-second demo</div>
    <!-- The evidence chain: two events, then the verdict in gold -->
    <svg class="chain" viewBox="0 0 160 70" aria-hidden="true">
      <polyline points="15,46 75,16 131,37" fill="none" stroke="#B8F53D" stroke-width="2.4"/>
      <circle cx="15" cy="46" r="5" fill="#B8F53D"/>
      <circle cx="75" cy="16" r="5" fill="#B8F53D"/>
      <circle cx="131" cy="37" r="17" fill="none" stroke="#C9A227" stroke-width="1.6" opacity="0.8"/>
      <circle cx="131" cy="37" r="6" fill="#C9A227"/>
    </svg>
  </div>
</body>
</html>
