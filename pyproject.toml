# Workspace tooling config only. Installable packages live in packages/* and apps/*.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# PLE: errors Python raises only at compile time, e.g. a global used before its declaration
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PLE"]
# Urdu and Arabic text is meant: the full stop, Eastern digit zero and decimal separator.
allowed-confusables = ["\u06d4", "\u0660", "\u066b"]

[tool.ruff.lint.isort]
known-first-party = ["match_events", "court"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["packages/event-schema/tests", "apps/api/tests"]
pythonpath = ["apps/api/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
